<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nasz Dom" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Nasz Dom – Opłaty</title>
  <style>
    :root{--blue:#1976f3;--blue2:#0b65e8;--ink:#18202b;--muted:#7d8795;--line:#e7ebf0;--bg:#f5f7fa;--card:#fff;--red:#ef4444;--green:#20a45b;--orange:#f59e0b;--shadow:0 8px 28px rgba(20,35,60,.08)}
    *{box-sizing:border-box} html,body{margin:0;background:#0e1117;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;color:var(--ink)}
    body{min-height:100vh}.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden;padding-bottom:82px}
    .top{padding:14px 18px 12px;background:rgba(247,249,252,.96);position:sticky;top:0;z-index:20;border-bottom:1px solid #edf0f4;backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:10px}.housemark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8ecb67,#3c8e4b);display:grid;place-items:center;font-size:25px;box-shadow:0 5px 16px rgba(55,125,65,.18)}
    h1{font-size:24px;line-height:1;margin:0 0 4px;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:12px;color:var(--muted);font-weight:600}.settings{margin-left:auto;width:38px;height:38px;border:0;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:20px}
    .screen{padding:14px 16px}.hero{height:175px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(160deg,#b9d7e6,#5d8b55 58%,#294a2f);box-shadow:var(--shadow);margin-bottom:12px}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.46))}.hero .hero-img{position:absolute;inset:0;background:url('house.jpg') center/cover no-repeat}.hero-copy{position:absolute;z-index:2;left:17px;bottom:15px;color:white;text-shadow:0 2px 10px rgba(0,0,0,.35)}.hero-copy strong{font-size:20px}.hero-copy small{display:block;margin-top:3px;font-size:11px;opacity:.9}
    .section-title{font-weight:800;font-size:17px;margin:15px 2px 9px}.card{background:var(--card);border-radius:17px;box-shadow:var(--shadow);border:1px solid #eef1f4}.next{padding:14px}.next-top{display:flex;gap:12px;align-items:center}.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}.red{background:#fee6e7;color:#e93f45}.orange{background:#fff0db}.blue{background:#e4f0ff}.green{background:#e4f6e9}.dark{background:#eceff2}.next h2{font-size:14px;margin:0 0 3px}.amount{font-size:20px;font-weight:850}.due{font-size:11px;color:var(--red);font-weight:800;background:#fff0f0;padding:4px 7px;border-radius:7px;display:inline-block;margin-top:5px}.paid{color:var(--green);background:#eaf8ef}.pay-btn{border:0;background:var(--red);color:#fff;font-weight:800;border-radius:11px;padding:9px 12px;font-size:12px;cursor:pointer}.paid-btn{background:var(--green)}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum-card{padding:14px}.sum-label{font-size:11px;color:var(--muted);font-weight:700}.sum-value{font-size:22px;font-weight:850;margin-top:4px}.sum-value.green-t{color:var(--green)}.progress{height:7px;background:#e9edf1;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green);border-radius:99px;width:52%}
    .list{display:flex;flex-direction:column;gap:9px}.bill{padding:12px;display:flex;align-items:center;gap:11px}.bill .info{min-width:0;flex:1}.bill h3{font-size:14px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bill p{margin:0;color:var(--muted);font-size:11px}.bill-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}.bill-right strong{font-size:14px}.status{font-size:10px;font-weight:850;padding:4px 7px;border-radius:7px}.status.red-s{color:#e23e45;background:#fff0f0}.status.green-s{color:#13894a;background:#e8f8ee}.empty{padding:26px;text-align:center;color:var(--muted)}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:10px}.tab{border:0;background:#edf1f6;color:#657181;border-radius:10px;padding:8px 12px;font-weight:800;font-size:11px;white-space:nowrap}.tab.active{background:var(--blue);color:white}
    .calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calendar-head button{border:0;background:#fff;width:36px;height:36px;border-radius:10px;box-shadow:var(--shadow);font-size:18px}.month{font-weight:850}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week span{font-size:10px;color:#8a94a2;font-weight:700;padding:5px 0}.day{height:42px;display:grid;place-items:center;font-size:12px;position:relative}.day b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}.day.today b{background:var(--blue);color:#fff}.dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--red)}.day.paid .dot{background:var(--green)}
    .form label{display:block;font-size:11px;color:#687484;font-weight:800;margin:12px 0 6px}.input,.select{width:100%;padding:12px;border:1px solid #e0e5eb;border-radius:11px;background:#fff;font-size:14px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checks{display:flex;flex-direction:column;gap:9px}.check{display:flex;gap:9px;align-items:center;font-size:12px;font-weight:700}.check input{accent-color:var(--blue)}.primary{width:100%;border:0;background:var(--blue);color:#fff;font-weight:850;padding:13px;border-radius:12px;margin-top:16px;font-size:14px}.danger{width:100%;border:0;background:#fff0f0;color:#dc3d44;font-weight:850;padding:12px;border-radius:12px;margin-top:8px}
    .detail{text-align:center;padding:18px}.detail .bigicon{margin:0 auto 10px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:30px}.detail h2{margin:0;font-size:20px}.detail small{color:var(--muted);font-weight:700}.facts{margin-top:18px;text-align:left;border-top:1px solid var(--line)}.fact{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.fact span{color:var(--muted)}.fact strong{text-align:right}.big-green{background:var(--green);color:#fff;width:100%;border:0;padding:13px;border-radius:11px;font-weight:850;margin-top:15px}.big-red{background:#fff0f0;color:#d83f45;width:100%;border:0;padding:12px;border-radius:11px;font-weight:850;margin-top:8px}
    .donut{width:178px;height:178px;border-radius:50%;margin:10px auto 15px;background:conic-gradient(#ef4444 0 70%,#f59e0b 70% 74%,#3288e8 74% 79%,#43a95d 79% 82%,#242b35 82% 83%,#e8edf2 83%);display:grid;place-items:center}.donut:after{content:"";width:120px;height:120px;border-radius:50%;background:#fff}.donut-text{position:absolute;text-align:center;font-weight:900}.donut-wrap{position:relative;display:grid;place-items:center}.donut-wrap .donut-text{z-index:2}.stats-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.legend{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}.stats-left{display:flex;align-items:center}.monthly{margin-top:13px;padding:13px;background:#eaf8ef;border-radius:13px}.monthly strong{display:block;font-size:20px;color:#12834a}.monthly span{font-size:11px;color:#51715d}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:72px;background:rgba(255,255,255,.96);border-top:1px solid #e8ebef;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:50;backdrop-filter:blur(15px)}.nav{border:0;background:none;color:#778292;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}.nav b{font-size:20px;line-height:1}.nav.active{color:var(--blue)}.nav.plus b{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 7px 18px rgba(25,118,243,.32);margin-top:-21px;font-size:25px}.fab-label{font-size:10px;margin-top:-1px}
    .modal{position:fixed;inset:0;background:rgba(12,18,28,.42);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}.sheet{background:#f7f9fc;border-radius:25px 25px 0 0;width:min(430px,100%);margin:auto 0 0;padding:18px 17px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{font-size:18px;margin:0}.close{border:0;background:#e9edf2;width:34px;height:34px;border-radius:50%}.install{background:#e9f2ff;border:1px solid #d5e6ff;border-radius:14px;padding:12px;margin:12px 0;font-size:12px;line-height:1.4}.install button{border:0;background:var(--blue);color:#fff;padding:9px 12px;border-radius:9px;font-weight:800;margin-top:7px}
    @media(min-width:700px){body{padding:20px}.app{border-radius:32px;box-shadow:0 25px 80px rgba(0,0,0,.35)}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="brand"><div class="housemark">🏠</div><div><h1>Nasz Dom</h1><div class="subtitle">Wszystkie opłaty domu pod kontrolą</div></div><button class="settings" id="settingsBtn">⚙️</button></div></header>
  <main id="content"></main>
  <nav class="bottom">
    <button class="nav active" data-screen="home"><b>⌂</b>Start</button>
    <button class="nav" data-screen="bills"><b>▤</b>Opłaty</button>
    <button class="nav plus" id="addBtn"><b>＋</b><span class="fab-label">Dodaj</span></button>
    <button class="nav" data-screen="calendar"><b>□</b>Kalendarz</button>
    <button class="nav" data-screen="stats"><b>◔</b>Statystyki</button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='nasz-dom-oplaty-v1';
const TYPES={loan:{name:'Rata domu / kredytu',icon:'🏦',cls:'red'},insurance:{name:'Ubezpieczenie domu',icon:'🛡️',cls:'orange'},water:{name:'Woda / Abwasser / Grundsteuer / Müll',icon:'💧',cls:'blue'},chimney:{name:'Kominiarz (Schornsteinfeger)',icon:'🎩',cls:'dark'}};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{bills:[
{id:'loan',type:'loan',amount:950,date:'2026-10-01',repeat:'monthly',paid:false,reminders:[7,3,0],note:'Umowa kredytowa'},
{id:'insurance',type:'insurance',amount:280,date:'2026-10-15',repeat:'yearly',paid:false,reminders:[7,3,0],note:'Polisa domu'},
{id:'water',type:'water',amount:180,date:'2026-11-15',repeat:'quarterly',paid:false,reminders:[7,3,0],note:'Wasser / Abwasser / Grundsteuer / Müll'},
{id:'chimney',type:'chimney',amount:120,date:'2026-12-20',repeat:'yearly',paid:false,reminders:[7,3,0],note:'Schornsteinfeger'}]};
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function fmt(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n)}
function d(s){return new Date(s+'T12:00:00')}
function dateFmt(s){return d(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function daysTo(s){return Math.ceil((d(s)-new Date(new Date().toDateString()))/86400000)}
function status(b){if(b.paid)return ['OPŁACONE','green-s'];const n=daysTo(b.date);if(n<0)return ['ZALEGŁE','red-s'];if(n===0)return ['DZISIAJ','red-s'];return [`ZA ${n} DNI`,'red-s']}
function upcoming(){return [...data.bills].filter(b=>!b.paid).sort((a,b)=>d(a.date)-d(b.date))[0]||data.bills[0]}
function icon(b){let t=TYPES[b.type]||TYPES.loan;return `<div class="icon ${t.cls}">${t.icon}</div>`}
function billCard(b){let t=TYPES[b.type],st=status(b);return `<div class="card bill" data-id="${b.id}">${icon(b)}<div class="info"><h3>${t.name}</h3><p>${dateFmt(b.date)} · ${b.repeat==='monthly'?'miesięcznie':b.repeat==='quarterly'?'kwartalnie':'rocznie'}</p></div><div class="bill-right"><strong>${fmt(b.amount)}</strong><span class="status ${st[1]}">${st[0]}</span></div></div>`}
function renderHome(){let u=upcoming(), paid=data.bills.filter(x=>x.paid).reduce((a,b)=>a+b.amount,0),due=data.bills.filter(x=>!x.paid).reduce((a,b)=>a+b.amount,0);return `<section class="screen"><div class="hero"><div class="hero-img"></div><div class="hero-copy"><strong>Nasz Dom</strong><small>Wszystkie koszty domu w jednym miejscu</small></div></div><div class="section-title">Najbliższa płatność</div><div class="card next"><div class="next-top">${icon(u)}<div style="flex:1"><h2>${TYPES[u.type].name}</h2><div class="amount">${fmt(u.amount)}</div><span class="due ${u.paid?'paid':''}">${u.paid?'OPŁACONE':dateFmt(u.date)}</span></div>${!u.paid?`<button class="pay-btn" onclick="markPaid('${u.id}')">ZAPŁAĆ</button>`:''}</div></div><div class="section-title">Ten miesiąc</div><div class="summary"><div class="card sum-card"><div class="sum-label">Do zapłaty</div><div class="sum-value">${fmt(due)}</div><div class="progress"><i style="width:${due+paid?Math.round(paid/(paid+due)*100):0}%"></i></div></div><div class="card sum-card"><div class="sum-label">Zapłacono</div><div class="sum-value green-t">${fmt(paid)}</div><div style="font-size:10px;color:#7d8795;margin-top:10px">Zaznaczaj płatności po wykonaniu</div></div></div><div class="section-title">Opłaty domu</div><div class="list">${data.bills.map(billCard).join('')}</div></section>`}
function renderBills(){return `<section class="screen"><div class="section-title" style="margin-top:4px">Opłaty domu</div><div class="tabs"><button class="tab active">Wszystkie</button><button class="tab">Do zapłaty</button><button class="tab">Opłacone</button></div><div class="list">${data.bills.map(billCard).join('')}</div></section>`}
function renderCalendar(){let now=new Date(), y=now.getFullYear(),m=now.getMonth();let first=new Date(y,m,1).getDay();first=(first+6)%7;let count=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div class="day"></div>';for(let day=1;day<=count;day++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`, b=data.bills.find(x=>x.date===ds),today=day===now.getDate();cells+=`<div class="day ${today?'today':''} ${b&&b.paid?'paid':''}"><b>${day}</b>${b?'<i class="dot"></i>':''}</div>`}return `<section class="screen"><div class="calendar-head"><button>‹</button><div class="month">${now.toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}</div><button>›</button></div><div class="card" style="padding:10px"><div class="week">${['Pon','Wt','Śr','Czw','Pt','Sob','Nie'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div><div class="section-title">Najbliższe terminy</div><div class="list">${[...data.bills].sort((a,b)=>d(a.date)-d(b.date)).map(billCard).join('')}</div></section>`}
function renderStats(){let total=data.bills.reduce((a,b)=>a+b.amount*(b.repeat==='monthly'?12:b.repeat==='quarterly'?4:1),0);let paid=data.bills.filter(b=>b.paid).reduce((a,b)=>a+b.amount,0);return `<section class="screen"><div class="section-title" style="margin-top:4px">Statystyki</div><div class="card" style="padding:15px"><div class="donut-wrap"><div class="donut"></div><div class="donut-text"><div style="font-size:25px">${fmt(total)}</div><div style="font-size:11px;color:#7d8795">rocznie</div></div></div>${data.bills.map((b,i)=>{let t=TYPES[b.type],annual=b.amount*(b.repeat==='monthly'?12:b.repeat==='quarterly'?4:1);return `<div class="stats-row"><div class="stats-left"><i class="legend" style="background:${['#ef4444','#f59e0b','#3288e8','#242b35'][i]}"></i>${t.name}</div><strong>${fmt(annual)}</strong></div>`}).join('')}<div class="monthly"><span>Średni koszt domu / miesiąc</span><strong>${fmt(total/12)}</strong></div></div></section>`}
function render(){let screen=window.screenName||'home';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.screen===screen));document.getElementById('content').innerHTML=screen==='home'?renderHome():screen==='bills'?renderBills():screen==='calendar'?renderCalendar():renderStats();document.querySelectorAll('.bill').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));}
function openDetail(id){let b=data.bills.find(x=>x.id===id);if(!b)return;let t=TYPES[b.type], st=status(b);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>Szczegóły opłaty</h2><button class="close" onclick="closeModal()">×</button></div><div class="detail"><div class="bigicon ${t.cls}">${t.icon}</div><h2>${t.name}</h2><small>Opłata związana z domem</small><div class="facts"><div class="fact"><span>Kwota</span><strong>${fmt(b.amount)}</strong></div><div class="fact"><span>Termin</span><strong>${dateFmt(b.date)}</strong></div><div class="fact"><span>Powtarzanie</span><strong>${b.repeat==='monthly'?'Co miesiąc':b.repeat==='quarterly'?'Co kwartał':'Co rok'}</strong></div><div class="fact"><span>Status</span><strong style="color:${b.paid?'#13894a':'#e23e45'}">${st[0]}</strong></div><div class="fact"><span>Przypomnienia</span><strong>7 dni · 3 dni · dzień płatności</strong></div></div><button class="primary" onclick="openEdit('${b.id}')">✏️ Edytuj opłatę</button>${b.paid?'<button class="big-green" onclick="markUnpaid(\''+b.id+'\')">↩ Cofnij status opłacone</button>':'<button class="big-green" onclick="markPaid(\''+b.id+'\')">✓ Oznacz jako opłacone</button>'}<button class="big-red" onclick="deleteBill('${b.id}')">Usuń opłatę</button></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function markPaid(id){let b=data.bills.find(x=>x.id===id);if(b){b.paid=true;b.paidAt=new Date().toISOString().slice(0,10);save();closeModal();render();}}
function markUnpaid(id){let b=data.bills.find(x=>x.id===id);if(b){b.paid=false;delete b.paidAt;save();closeModal();render();}}
function deleteBill(id){if(confirm('Usunąć tę opłatę?')){data.bills=data.bills.filter(x=>x.id!==id);save();closeModal();render();}}
function openAdd(){document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>Nowa opłata domu</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" id="addForm"><label>Rodzaj opłaty</label><select class="select" id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><label>Komu płacę?</label><input class="input" id="provider" placeholder="np. bank / Gemeinde / ubezpieczyciel"/><div class="row"><div><label>Kwota</label><input class="input" id="amount" type="number" step="0.01" required></div><div><label>Termin</label><input class="input" id="date" type="date" required></div></div><label>Powtarzanie</label><select class="select" id="repeat"><option value="monthly">Co miesiąc</option><option value="quarterly">Co kwartał</option><option value="yearly">Co rok</option></select><label>Przypomnienia</label><div class="checks"><label class="check"><input type="checkbox" checked> 7 dni wcześniej</label><label class="check"><input type="checkbox" checked> 3 dni wcześniej</label><label class="check"><input type="checkbox" checked> W dniu płatności</label></div><label>Notatka</label><input class="input" id="note" placeholder="Numer umowy / dodatkowa informacja"><button class="primary">Zapisz opłatę</button></form>`;document.getElementById('modal').classList.add('show');document.getElementById('addForm').onsubmit=e=>{e.preventDefault();let type=document.getElementById('type').value;data.bills.push({id:type+'-'+Date.now(),type,amount:Number(document.getElementById('amount').value),date:document.getElementById('date').value,repeat:document.getElementById('repeat').value,paid:false,reminders:[7,3,0],provider:document.getElementById('provider').value,note:document.getElementById('note').value});save();closeModal();render();}}

function openEdit(id){
  let b=data.bills.find(x=>x.id===id);
  if(!b)return;
  document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>Edytuj opłatę</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" id="editForm">
  <label>Rodzaj opłaty</label><select class="select" id="editType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${b.type===k?'selected':''}>${v.name}</option>`).join('')}</select>
  <label>Komu płacę?</label><input class="input" id="editProvider" value="${(b.provider||'').replace(/"/g,'&quot;')}" placeholder="np. bank / Gemeinde / ubezpieczyciel"/>
  <div class="row"><div><label>Kwota</label><input class="input" id="editAmount" type="number" step="0.01" min="0" value="${b.amount}" required></div>
  <div><label>Termin</label><input class="input" id="editDate" type="date" value="${b.date}" required></div></div>
  <label>Powtarzanie</label><select class="select" id="editRepeat">
    <option value="monthly" ${b.repeat==='monthly'?'selected':''}>Co miesiąc</option>
    <option value="quarterly" ${b.repeat==='quarterly'?'selected':''}>Co kwartał</option>
    <option value="yearly" ${b.repeat==='yearly'?'selected':''}>Co rok</option>
  </select>
  <label>Notatka</label><input class="input" id="editNote" value="${(b.note||'').replace(/"/g,'&quot;')}" placeholder="Numer umowy / dodatkowa informacja"/>
  <button class="primary">💾 Zapisz zmiany</button>
  </form>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('editForm').onsubmit=e=>{
    e.preventDefault();
    b.type=document.getElementById('editType').value;
    b.provider=document.getElementById('editProvider').value;
    b.amount=Number(document.getElementById('editAmount').value);
    b.date=document.getElementById('editDate').value;
    b.repeat=document.getElementById('editRepeat').value;
    b.note=document.getElementById('editNote').value;
    save(); closeModal(); render();
  };
}
function openSettings(){document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>Ustawienia</h2><button class="close" onclick="closeModal()">×</button></div><div class="card" style="padding:15px;margin-top:12px"><div class="fact"><span>Powiadomienia</span><button class="pay-btn" onclick="requestNotifications()">Włącz</button></div><div class="fact"><span>7 dni wcześniej</span><strong>ON</strong></div><div class="fact"><span>3 dni wcześniej</span><strong>ON</strong></div><div class="fact"><span>W dniu płatności</span><strong>ON</strong></div></div><div class="install"><strong>Instalacja na iPhone</strong><br>W Safari wybierz „Udostępnij” → „Dodaj do ekranu początkowego”. Aplikacja działa wtedy jak PWA.</div><button class="danger" onclick="resetData()">Przywróć przykładowe opłaty</button>`;document.getElementById('modal').classList.add('show')}
async function requestNotifications(){if('Notification' in window){let p=await Notification.requestPermission();alert(p==='granted'?'Powiadomienia są włączone.':'Powiadomienia nie zostały włączone.')}}
function resetData(){if(confirm('Przywrócić przykładowe dane?')){localStorage.removeItem(KEY);location.reload()}}
document.querySelectorAll('.nav').forEach(x=>x.addEventListener('click',()=>{if(x.dataset.screen){window.screenName=x.dataset.screen;render()}}));document.getElementById('addBtn').onclick=openAdd;document.getElementById('settingsBtn').onclick=openSettings;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
